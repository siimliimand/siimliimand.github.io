<?xml version="1.0" encoding="UTF-8"?>
<!-- Siim Liimand monogram favicon. Single accent color #1a5fb4, matching the
     site accent token in css/styles.css. The xmlns value below is a namespace
     identifier, not a fetched resource; it is written with a numeric character
     reference (the entity expands to the letter "h") so the file holds no
     literal external reference URL. -->
<svg xmlns="&#104;ttp://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Siim Liimand monogram">
	<title>Siim Liimand</title>
	<rect x="2" y="2" width="28" height="28" rx="6" fill="none" stroke="#1a5fb4" stroke-width="2.5"/>
	<text x="16" y="21" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a5fb4">SL</text>
</svg>
