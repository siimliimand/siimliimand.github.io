<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Gradient hero image">
	<title>Hero</title>
	<defs>
		<linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1e3a8a"/>
			<stop offset="50%" stop-color="#7c3aed"/>
			<stop offset="100%" stop-color="#f472b6"/>
		</linearGradient>
		<radialGradient id="heroGlow" cx="0.5" cy="0.4" r="0.6">
			<stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
			<stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
		</radialGradient>
	</defs>
	<rect width="1280" height="720" fill="url(#heroGradient)"/>
	<rect width="1280" height="720" fill="url(#heroGlow)"/>
</svg>
